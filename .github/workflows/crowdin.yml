name: "Crowdin Translations"
run-name: "Crowdin Translations #${{ github.run_number }}"

on:
  push:
    branches: [main]
    paths:
      - "common/src/main/resources/assets/iris_search/lang/en_us.json"
  workflow_dispatch:
    inputs:
      upload_translations:
        description: "Also upload existing repo translations to Crowdin (one-time seeding)"
        type: boolean
        default: false
        required: true
      test_mode:
        description: "Target main-test instead of main (for validating this workflow)"
        type: boolean
        default: false
        required: true
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCALIZATION_BRANCH: l10n_crowdin_translations
  TARGET_BRANCH: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_mode) && 'main-test' || 'main' }}
  LANG_PATH: common/src/main/resources/assets/iris_search/lang
  CROWDIN_PROJECT_SLUG: TODO-set-your-crowdin-project-slug

permissions:
  contents: write
  pull-requests: write

jobs:
  check-source-changes:
    name: "Check for source changes"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      lang_changed: ${{ steps.check.outputs.lang_changed }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Check for recent changes to source file"
        id: check
        # The nightly schedule fires every day regardless of whether en_us.json
        # actually changed since the last run. Skip the upload step when
        # there's nothing new to push to Crowdin.
        run: |
          if [ -n "$(git log --since='25 hours ago' --format= -- ${{ env.LANG_PATH }}/en_us.json)" ]; then
            echo "lang_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "lang_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # sync-lang only talks to Crowdin and never touches git (push_sources/
  # push_translations: false) - it just produces an artifact. Only
  # process-changes (below) ever writes to a branch.
  sync-lang:
    name: "Sync Lang"
    runs-on: ubuntu-latest
    needs: [check-source-changes]
    if: always() && (needs.check-source-changes.result == 'success' || needs.check-source-changes.result == 'skipped')
    outputs:
      has_changes: ${{ steps.check-changes.outputs.has_changes || 'false' }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Crowdin (Lang)"
        uses: crowdin/github-action@v2
        with:
          upload_sources: ${{ github.event_name != 'schedule' || needs.check-source-changes.outputs.lang_changed == 'true' }}
          upload_translations: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_translations }}
          download_translations: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          push_sources: false
          push_translations: false
          skip_untranslated_strings: false
          config: .github/config/crowdin.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}

      - name: "Fix workspace ownership"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # The Crowdin action runs in a Docker container as root, which leaves
        # the checked-out workspace root-owned. Reclaim it before the next
        # steps read/write files as the normal runner user.
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: "Check for changes"
        id: check-changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "$(git status --porcelain -- '${{ env.LANG_PATH }}/*.json')" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Upload lang files artifact"
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lang-files
          path: "${{ env.LANG_PATH }}/*.json"
          retention-days: 1

  process-changes:
    name: "Split Clean/Flagged and Commit"
    runs-on: ubuntu-latest
    needs: [sync-lang]
    if: |
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.sync-lang.outputs.has_changes == 'true'
    outputs:
      has_flagged_changes: ${{ steps.flagged-check.outputs.has_flagged_changes || 'false' }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: "Prepare target branch"
        run: |
          if [ "${{ env.TARGET_BRANCH }}" != "main" ]; then
            if git ls-remote --exit-code --heads origin "${{ env.TARGET_BRANCH }}" > /dev/null 2>&1; then
              git fetch origin "${{ env.TARGET_BRANCH }}"
              git checkout "${{ env.TARGET_BRANCH }}"
            else
              git checkout -b "${{ env.TARGET_BRANCH }}"
            fi
          fi

      - name: "Download lang files"
        uses: actions/download-artifact@v4
        with:
          name: lang-files
          path: _new

      - name: "Split changes into clean and flagged"
        run: node .github/scripts/split-by-content-safety.js
        env:
          PROFANITY_REPO_TOKEN: ${{ secrets.PROFANITY_REPO_TOKEN }}

      - name: "Configure Git"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: "Commit and push clean changes to target branch"
        run: |
          git add -- '${{ env.LANG_PATH }}/*.json'
          if git diff --cached --quiet; then
            echo "No clean changes to commit."
          else
            git commit -m "[translation] Update lang translations"
            git push origin "${{ env.TARGET_BRANCH }}"
          fi

      - name: "Check for flagged content"
        id: flagged-check
        run: |
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('_flagged-report.json','utf8')).length)")
          if [ "$COUNT" -gt 0 ]; then
            echo "has_flagged_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_flagged_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Commit and push flagged changes to localization branch"
        if: steps.flagged-check.outputs.has_flagged_changes == 'true'
        run: |
          git checkout -B "${{ env.LOCALIZATION_BRANCH }}"
          node .github/scripts/apply-flagged-report.js
          git add -- '${{ env.LANG_PATH }}/*.json'
          git commit -m "[translation] Flagged translations pending review"
          git push --force origin "${{ env.LOCALIZATION_BRANCH }}"

      - name: "Upload flagged report"
        if: steps.flagged-check.outputs.has_flagged_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flagged-report
          path: _flagged-report.json
          retention-days: 1

  create-pr:
    name: "Create Pull Request"
    runs-on: ubuntu-latest
    needs: [process-changes]
    if: |
      always() &&
      needs.process-changes.outputs.has_flagged_changes == 'true'
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Download flagged report"
        uses: actions/download-artifact@v4
        with:
          name: flagged-report

      - name: "Build PR body"
        run: |
          {
            echo "New translations from Crowdin were flagged by the content safety check and need manual review before merging."
            echo ""
            echo "### Flagged items"
            node -e "
              const items = JSON.parse(require('fs').readFileSync('_flagged-report.json', 'utf8'));
              const link = 'https://crowdin.com/project/${{ env.CROWDIN_PROJECT_SLUG }}';
              const labels = {
                'no-wordlist-coverage': 'no profanity wordlist for this language yet - needs one added',
                'profanity-match': 'profanity match',
                'suspicious-url': 'URL not found in the English source or whitelist',
                'homoglyph-url': 'URL contains mixed-script (lookalike) characters',
                'phone-number': 'phone number detected',
                'html-injection': 'HTML/script injection pattern',
                'spam-repetition': 'repeated character/word spam pattern',
              };
              for (const item of items) {
                const reasonText = item.reasons.map((r) => labels[r] || r).join('; ');
                console.log('- **' + item.file + '** \`' + item.key + '\` (' + item.language + ') - ' + reasonText);
                console.log('  - Matched: ' + item.matchedWords.join(', '));
                console.log('  - Old: ' + JSON.stringify(item.oldValue));
                console.log('  - New: ' + JSON.stringify(item.newValue));
                console.log('  - [Review in Crowdin](' + link + ') - search for the key above');
              }
            "
            echo ""
            echo "### If rejected"
            echo "Delete or fix the translation directly in Crowdin using the link above, so it isn't proposed again unchanged."
          } > pr-body.md
          echo "--- PR body ---"
          cat pr-body.md

      # Uses gh directly instead of an action so real error output shows up in
      # the logs - the devops-infra action's own error message hid the actual
      # cause when we first hit "Actions is not permitted to create PRs".
      - name: "Create or update Pull Request"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          MAX_RETRIES=3
          ATTEMPT=1

          while [ "$ATTEMPT" -le "$MAX_RETRIES" ]; do
            echo "[Attempt $ATTEMPT/$MAX_RETRIES] Checking for an existing PR (${{ env.LOCALIZATION_BRANCH }} -> ${{ env.TARGET_BRANCH }})..."

            LIST_OUTPUT="$(gh pr list \
              --repo "${{ github.repository }}" \
              --head "${{ env.LOCALIZATION_BRANCH }}" \
              --base "${{ env.TARGET_BRANCH }}" \
              --state open \
              --json number \
              --jq '.[0].number // empty' 2>&1)"
            LIST_STATUS=$?

            if [ "$LIST_STATUS" -ne 0 ]; then
              echo "gh pr list failed (exit $LIST_STATUS): $LIST_OUTPUT"
            elif [ -n "$LIST_OUTPUT" ]; then
              echo "Found existing PR #$LIST_OUTPUT - updating it"
              if EDIT_OUTPUT="$(gh pr edit "$LIST_OUTPUT" \
                  --repo "${{ github.repository }}" \
                  --title "Flagged Crowdin translations for review" \
                  --body-file pr-body.md 2>&1)"; then
                echo "PR #$LIST_OUTPUT updated."
                exit 0
              else
                echo "gh pr edit failed: $EDIT_OUTPUT"
              fi
            else
              echo "No existing PR found - creating a new one"
              if CREATE_OUTPUT="$(gh pr create \
                  --repo "${{ github.repository }}" \
                  --head "${{ env.LOCALIZATION_BRANCH }}" \
                  --base "${{ env.TARGET_BRANCH }}" \
                  --title "Flagged Crowdin translations for review" \
                  --body-file pr-body.md \
                  --label "translations" 2>&1)"; then
                echo "PR created: $CREATE_OUTPUT"
                exit 0
              else
                echo "gh pr create failed: $CREATE_OUTPUT"
              fi
            fi

            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_RETRIES" ]; then
              echo "Retrying in 10s..."
              sleep 10
            fi
          done

          echo "::error::Failed to create/update the PR after $MAX_RETRIES attempts - see the gh output above for the actual cause."
          exit 1
